[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ps2-doc-forensics"
version = "1.0.0"
description = "AI Document Forensics and Contextual Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "pydantic>=2.9.2",
    "pymupdf>=1.24.10",
    "opencv-python-headless>=4.10.0.84",
    "numpy>=2.0.0",
    "reportlab>=4.2.0",
    "pytest>=8.0.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]
